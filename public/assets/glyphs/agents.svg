<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
  <!-- Agent loop / orbital (not a robot): three orbits at 60-degree steps so
       the silhouette reads round and full, not flattened. Swap in place. -->
  <ellipse cx="120" cy="120" rx="94" ry="38"/>
  <ellipse cx="120" cy="120" rx="94" ry="38" transform="rotate(60 120 120)"/>
  <ellipse cx="120" cy="120" rx="94" ry="38" transform="rotate(120 120 120)"/>
  <circle cx="120" cy="120" r="13"/>
  <circle cx="214" cy="120" r="7"/>
  <circle cx="73" cy="39" r="7"/>
  <circle cx="167" cy="201" r="7"/>
</svg>
