<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 114 114">
  <!-- The real studio "ai" mark, traced from the signature GIF's pixel grid
       (10-unit cells). Square canvas with the mark centered vertically: the
       particle sampler stretches this file into a square raster, so a square
       viewBox is what keeps the on-screen proportions true. -->
  <g fill="#FFFFFF" transform="translate(0 32)">
    <rect x="10" y="0" width="50" height="10"/>
    <rect x="50" y="10" width="20" height="10"/>
    <rect x="10" y="20" width="60" height="10"/>
    <rect x="0" y="30" width="20" height="10"/>
    <rect x="50" y="30" width="20" height="10"/>
    <rect x="10" y="40" width="60" height="10"/>
    <rect x="84" y="0" width="30" height="50" fill="#76D2FF"/>
  </g>
</svg>
